# Ejemplo: uso de RESTART_POLICY para distintos entornos

# En servidor: unless-stopped (default, no hace falta declararlo)
st7:
  mi-api:
    branch: main
    port: 9080
    stack: spring_maria

    # Sin RESTART_POLICY → usa "unless-stopped" (default del compose)

    mysql_user: mi-api
    mysql_db: mi-api
    mysql_pass: mi-api
    mysql_external_port: 9083
    application_properties: src/main/resources/application.st7.properties

# En local: desactivar restart para facilitar debugging
local:
  mi-api:
    port: 9080
    stack: spring_maria

    env:
      RESTART_POLICY: "no"   # Obligatorio en local para evitar auto-restart

    mysql_user: mi-api
    mysql_db: mi-api
    mysql_pass: mi-api
    mysql_external_port: 3307
    application_properties: src/main/resources/application.server.properties
