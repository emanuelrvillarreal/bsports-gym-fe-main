# Ejemplo: application.server.properties para Spring Boot
# Un único archivo que funciona para todos los entornos (st7, produccion, local).
# Los valores específicos de cada entorno se declaran en deploy.yml bajo env:

server.port=${SERVER_PORT:8080}

# Base de datos (variables generadas automáticamente por el deployer en spring_maria/spring_postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.file.path=${LOGGING_FILE_PATH:/app/logs}
logging.file.name=${LOGGING_FILE_PATH:/app/logs}/${LOGGING_FILE_BASENAME:app}.log
logging.level.root=INFO
logging.level.com.empresa=DEBUG

# Variables propias de la aplicación (declarar en env: del deploy.yml)
app.external-api.url=${EXTERNAL_API_URL}
app.feature.export-enabled=${FEATURE_EXPORT_ENABLED:false}
app.feature.beta-ui=${FEATURE_BETA_UI:false}
app.http.read-timeout-seconds=${HTTP_READ_TIMEOUT_SECONDS:30}
app.max-upload.mb=${MAX_UPLOAD_MB:10}
app.sync.cron=${SYNC_CRON:0 0 3 * * *}
