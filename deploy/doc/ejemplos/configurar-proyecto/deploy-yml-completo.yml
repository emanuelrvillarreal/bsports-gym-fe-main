# Ejemplo completo: deploy.yml con servidor y local
# Proyecto con frontend Angular + backend Spring Maria

st7:
  mi-app-fe:
    branch: develop
    port: 9051
    path: mi-app
    domain: stg.blueopendata.com

    stack: angular
    environment: st7
    composer_file: plantillas/angular-21-node-22/docker-compose.yml
    nginx_config: plantillas/angular-21-node-22/nginx.host-reverse-proxy.conf

  mi-app-be:
    branch: develop
    port: 9050
    path: mi-app
    domain: stg.blueopendata.com

    stack: spring_maria

    env:
      EXTERNAL_API_URL: "https://api.staging.ejemplo.com"
      FEATURE_EXPORT_ENABLED: true
      HTTP_TIMEOUT: 45

    mysql_user: mi-app
    mysql_db: mi-app
    mysql_pass: mi-app
    mysql_external_port: 9083

    composer_file: plantillas/spring-3.9-java-17-maria-11/docker-compose.yml
    nginx_config: plantillas/spring-3.9-java-17-maria-11/nginx.spring-boot-api.conf
    application_properties: src/main/resources/application.st7.properties

local:
  mi-app-fe:
    port: 4200
    path: mi-app
    stack: angular

    env:
      RESTART_POLICY: "no"

    environment: local
    composer_file: plantillas/angular-21-node-22/docker-compose.yml

  mi-app-be:
    port: 9050
    stack: spring_maria

    env:
      RESTART_POLICY: "no"
      EXTERNAL_API_URL: "http://localhost:8081"
      FEATURE_EXPORT_ENABLED: true
      HTTP_TIMEOUT: 45

    mysql_user: mi-app
    mysql_db: mi-app
    mysql_pass: mi-app
    mysql_external_port: 3307

    composer_file: plantillas/spring-3.9-java-17-maria-11/docker-compose.yml
    application_properties: src/main/resources/application.server.properties
