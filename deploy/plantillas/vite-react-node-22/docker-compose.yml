name: ${CONTAINER_NAME}

services:
  app:
    image: ${CONTAINER_NAME}:latest
    build:
      context: ../../..
      dockerfile: deploy/plantillas/vite-react-node-22/Dockerfile
      args:
        VITE_BUILD_MODE: ${VITE_BUILD_MODE:-production}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: ${CONTAINER_NAME}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${EXTERNAL_PORT}:80"
    env_file:
      - path: ../../runtime.env
        required: false
    volumes:
      - ${LOGS_VOLUME:-/var/log}/${CONTAINER_NAME}:/var/log/nginx
