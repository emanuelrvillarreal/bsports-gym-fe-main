version: 1.1

local:
  bsports-club-fe:
    port: 6036
    stack: angular_ssr

    environment: production
    composer_file: angular-21-node-22-ssr/docker-compose.yml

    env:
      RESTART_POLICY: "no"
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1"

st7:
  bsports-club-fe:
    branch: develop
    port: 6036
    path: bsports-club
    stack: angular_ssr
    
    env:
      RESTART_POLICY: "no"

    environment: st7
    composer_file: angular-21-node-22-ssr/docker-compose.yml
    nginx_config: angular-21-node-22-ssr/nginx.host-reverse-proxy.conf

st8:
