<form
  id="formulario-socio"
  class="formulario-gestion-socio"
  appValidacionFormulario
  (submit)="$event.preventDefault(); enviar()"
>
  <small
    class="formulario-gestion-socio__error"
    [class.formulario-gestion-socio__error--visible]="errorVisible()"
    role="alert"
    >{{ mensajeError() }}</small
  >
  <div class="formulario-gestion-socio__grilla">
    <label for="socio-nombre"
      ><span>Nombre *</span
      ><input
        id="socio-nombre"
        required
        [attr.data-app-invalido]="!nombre().trim() ? 'true' : null"
        [value]="nombre()"
        (input)="actualizarTexto('nombre', $event)"
    /></label>
    <label for="socio-apellido"
      ><span>Apellido *</span
      ><input
        id="socio-apellido"
        required
        [attr.data-app-invalido]="!apellido().trim() ? 'true' : null"
        [value]="apellido()"
        (input)="actualizarTexto('apellido', $event)"
    /></label>
    <label for="socio-email"
      ><span>Email *</span
      ><input
        id="socio-email"
        type="email"
        required
        [attr.data-app-invalido]="!email().trim() ? 'true' : null"
        [value]="email()"
        (input)="actualizarTexto('email', $event)"
    /></label>
    @if (esAlta()) {
      <app-input-password
        id="socio-password"
        etiqueta="Contraseña *"
        autocomplete="new-password"
        [attr.data-app-invalido]="!password() ? 'true' : null"
        (valorCambiado)="password.set($event)"
      />
    }
    <label for="socio-dni"
      ><span>DNI *</span
      ><input
        id="socio-dni"
        inputmode="numeric"
        required
        maxlength="14"
        [attr.data-app-invalido]="!dniEsValido() ? 'true' : null"
        [value]="dni()"
        (input)="actualizarTexto('dni', $event)"
    /></label>
    <label for="socio-telefono"
      ><span>Teléfono</span
      ><input
        id="socio-telefono"
        type="tel"
        [value]="telefono()"
        (input)="actualizarTexto('telefono', $event)"
    /></label>
    <app-input-fecha
      id="socio-fecha-nacimiento"
      etiqueta="Fecha de nacimiento *"
      [valorInicial]="fechaNacimiento()"
      [requerido]="true"
      [attr.data-app-invalido]="!fechaNacimiento() ? 'true' : null"
      (valorCambiado)="fechaNacimiento.set($event)"
    />
    <app-select
      etiqueta="Sexo"
      placeholder="Elegir"
      [opciones]="opcionesSexo"
      [value]="sexo()"
      (valueChange)="sexo.set($event)"
    />
    @if (muestraNumeroSocio()) {
      <label for="socio-numero" class="formulario-gestion-socio__numero"
        ><span>N.º de socio</span
        ><input
          id="socio-numero"
          inputmode="numeric"
          maxlength="9"
          aria-describedby="socio-numero-ayuda"
          [attr.placeholder]="modo() === 'titular' ? siguienteNumeroSocio() : null"
          [attr.data-app-invalido]="!numeroSocioEsValido() ? 'true' : null"
          [value]="numeroSocio()"
          (input)="actualizarTexto('numeroSocio', $event)"
        /><small id="socio-numero-ayuda">{{ ayudaNumeroSocio() }}</small></label
      >
    }
    @if (!esTitular()) {
      <app-select
        [attr.data-app-invalido]="!parentesco() ? 'true' : null"
        etiqueta="Parentesco *"
        placeholder="Seleccionar parentesco"
        [opciones]="opcionesParentesco"
        [value]="parentesco()"
        (valueChange)="cambiarParentesco($event)"
      />
    }
  </div>

  @if (esAlta()) {
    <app-selector-descuentos
      [descuentos]="descuentosDisponibles()"
      [seleccionados]="descuentosSeleccionados()"
      [cargando]="cargandoDescuentos()"
      descripcion="Se aplican a la cuota social que se genere con el alta. Podés agregar más de uno."
      (descuentoAgregado)="agregarDescuentoSeleccionado($event)"
      (descuentoQuitado)="quitarDescuento($event)"
    />
  }
</form>
