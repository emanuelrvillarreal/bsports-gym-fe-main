<div class="deco__lineas" aria-hidden="true"></div>
<div class="deco__burbujas" aria-hidden="true">
  @for (b of burbujas; track $index) {
    <span
      class="deco__flotante"
      [class.deco__flotante--burbuja]="b.tipo === 'burbuja'"
      [style.left.%]="b.x"
      [style.width.rem]="b.tam"
      [style.height.rem]="b.tam"
      [style.animation-duration.s]="b.dur"
      [style.animation-delay.s]="b.delay"
    >
      @switch (b.tipo) {
        @case ('pesa') {
          <!-- Mancuerna -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="16" width="6" height="16" rx="2" />
            <rect x="10" y="12" width="6" height="24" rx="2" />
            <rect x="32" y="12" width="6" height="24" rx="2" />
            <rect x="38" y="16" width="6" height="16" rx="2" />
            <line x1="16" y1="24" x2="32" y2="24" />
          </svg>
        }
        @case ('kettlebell') {
          <!-- Pesa rusa -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 18a7 7 0 0 1 14 0" />
            <path d="M15 20h18" />
            <path d="M14 22a13 13 0 1 0 20 0Z" />
          </svg>
        }
        @case ('soga') {
          <!-- Soga para saltar -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="6" height="14" rx="3" />
            <rect x="36" y="4" width="6" height="14" rx="3" />
            <path d="M9 18c0 22 30 22 30 0" />
          </svg>
        }
        @case ('pelota') {
          <!-- Pelota -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="18" />
            <path d="M6 24h36" />
            <path d="M24 6c-7 5-7 31 0 36" />
            <path d="M24 6c7 5 7 31 0 36" />
          </svg>
        }
        @case ('cronometro') {
          <!-- Cronómetro -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="27" r="16" />
            <path d="M20 5h8" />
            <path d="M24 5v6" />
            <path d="M24 27l6-6" />
          </svg>
        }
        @case ('disco') {
          <!-- Disco de pesas -->
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="19" />
            <circle cx="24" cy="24" r="11" />
            <circle cx="24" cy="24" r="3" />
          </svg>
        }
      }
    </span>
  }
</div>
