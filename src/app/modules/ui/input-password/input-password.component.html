<label class="input-password" [style.--input-password-primario]="colorPrimario()">
  @if (etiqueta()) {
    <span class="input-password__etiqueta">{{ etiqueta() }}</span>
  }

  <span class="input-password__control">
    <input
      [id]="id() || null"
      [type]="visible() ? 'text' : 'password'"
      [value]="valor"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [required]="requerido()"
      [attr.aria-label]="etiqueta() ? null : ariaLabel()"
      [disabled]="deshabilitado"
      (input)="cambiarValor($event)"
      (blur)="marcarTocado()"
    />
    <button
      type="button"
      class="input-password__alternador"
      [class.input-password__alternador--activo]="visible()"
      [disabled]="deshabilitado"
      [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      [attr.title]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      (click)="alternarVisibilidad()"
    >
      <ng-icon [name]="visible() ? 'heroEyeSlash' : 'heroEye'" aria-hidden="true" />
    </button>
  </span>
</label>
